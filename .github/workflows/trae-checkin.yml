name: Trae 每日签到

on:
  schedule:
    # 北京时间 03:50（= UTC 19:50 前一天），避开整点（整点是全网高峰，容易被判「签到人数过多」）
    - cron: '50 19 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 逐号签到（错峰 5~15 秒）
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
          WECOM: ${{ secrets.WECOM }}
        run: node checkin.js

  heartbeat:
    name: 上报成功心跳
    needs: checkin
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthchecks
        run: |
          U="${{ vars.HC_PING_URL }}"
          if [ -z "$U" ]; then echo "[心跳] 未配置 HC_PING_URL，跳过"; exit 0; fi
          if curl -fsS --max-time 15 --retry 2 "$U"; then echo "[心跳] 已上报成功"; fi
